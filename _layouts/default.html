<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark__name">EXTREME</span>
      <span class="wordmark__sub">Lab · Illinois</span>
    </a>
    <nav class="nav" aria-label="Main">
      {% for item in site.nav %}
      <a href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="colophon">
    <div class="colophon__inner">
      <p class="colophon__lab">{{ site.title }} — {{ site.tagline }}</p>
      <p class="colophon__meta">
        {{ site.department }}, {{ site.institution }}<br>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </p>
    </div>
  </footer>
</body>
</html>
